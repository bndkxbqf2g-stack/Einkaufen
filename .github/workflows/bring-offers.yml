name: Bring-Prospekte für Zellingen auslesen

on:
  workflow_dispatch:
    inputs:
      location:
        description: Ort für die Bring-Angebote
        required: true
        default: Zellingen
        type: string
  schedule:
    - cron: '30 3 * * 0'

permissions:
  contents: write

concurrency:
  group: bring-offers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser und OCR installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Bring-Prospekte auslesen
        env:
          BRING_LOCATION: ${{ inputs.location || 'Zellingen' }}
          BRING_STORAGE_STATE_B64: ${{ secrets.BRING_STORAGE_STATE_B64 }}
          BRING_BROCHURE_URLS: ${{ vars.BRING_BROCHURE_URLS }}
        run: node automation/bring-offers.mjs
      - name: Angebotsdaten veröffentlichen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/bring-offers.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Bring-Angeboten."
            exit 0
          fi
          git commit -m "Update Bring offers for Zellingen"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort || true
            sleep 3
          done
          exit 1

