name: Deploy Angebotsküche to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'generated/**'
      - 'worker/**'
      - 'scripts/**'
      - 'automation/**'
      - 'supabase/**'
      - 'supabase-sync.js'
      - 'manifest.json'
      - 'icons/**'
      - 'dist/manifest.json'
      - 'dist/icons/**'
      - 'index.html'
      - '.github/workflows/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'dist/**'
      - 'generated/**'
      - 'worker/**'
      - 'scripts/**'
      - 'automation/**'
      - 'supabase/**'
      - 'supabase-sync.js'
      - 'manifest.json'
      - 'icons/**'
      - 'dist/manifest.json'
      - 'dist/icons/**'
      - 'index.html'
      - '.github/workflows/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build worker bundle
        run: node scripts/build-worker.mjs

      - name: Run automated tests
        run: node --test automation/*.test.mjs

      - name: Verify generated worker artifact is committed
        run: git diff --exit-code -- dist/server/index.js

      - name: Validate worker endpoints
        run: node scripts/validate-worker.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R dist/. _site/
          mkdir -p _site/generated
          cp -R generated/. _site/generated/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
